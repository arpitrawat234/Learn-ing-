<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
</head>
<body>

  <div class="app">
    <h1>Todo App</h1>
    <!-- Input Section -->
    <div class="input-section">
      <input type="text" placeholder="Enter task..." />
      <input type="number" placeholder="Minutes" />
      <button>Add Task</button>
    </div>
    <!-- Task List -->
    <ul class="task-list">

      <!-- Example Task Item -->
      <li class="task-item">

        <!-- Task Text -->
        <span class="task-text">Study JavaScript</span>

        <!-- Notes -->
        <div class="notes">
          <textarea placeholder="Add notes..."></textarea>
        </div>

        <!-- Timer -->
        <div class="timer">
          <span>25:00</span>
          <button>Start</button>
          <button>Reset</button>
        </div>

        <!-- Actions -->
        <div class="actions">
          <button>Complete</button>
          <button>Delete</button>
        </div>

      </li>

    </ul>

  </div>

</body>
</html>
